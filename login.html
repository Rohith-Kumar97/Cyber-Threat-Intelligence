<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberThreat - Login</title>
    <style>
        body {
            background: #0b1120;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #172338;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
        }
        h2 { text-align: center; color: #00d4ff; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00bcd4;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        a { color: #00d4ff; }
        p { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome Back</h2>
        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>New user? <a href="/signup">Sign Up</a></p>
    </div>
</body>
</html>
